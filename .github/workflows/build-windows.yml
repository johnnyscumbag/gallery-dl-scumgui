name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build ScumGUI for Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Prepare Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          @'
          from pathlib import Path
          import struct
          import zlib

          source = Path("assets/scumgui.png")
          repaired = Path("build/scumgui-master.png")
          data = source.read_bytes()

          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise RuntimeError("The ScumGUI PNG does not have a valid PNG signature.")

          pos = 8
          output = bytearray(data[:8])
          while pos < len(data):
              if pos + 12 > len(data):
                  raise RuntimeError("Truncated PNG chunk.")
              length = struct.unpack(">I", data[pos:pos + 4])[0]
              chunk_type = data[pos + 4:pos + 8]
              chunk_end = pos + 12 + length
              if chunk_end > len(data):
                  raise RuntimeError("Truncated PNG chunk data.")
              chunk_data = data[pos + 8:pos + 8 + length]
              crc = zlib.crc32(chunk_type + chunk_data) & 0xffffffff
              output.extend(struct.pack(">I", length))
              output.extend(chunk_type)
              output.extend(chunk_data)
              output.extend(struct.pack(">I", crc))
              pos = chunk_end

          repaired.write_bytes(output)

          from PIL import Image
          with Image.open(repaired) as image:
              image.load()
              if image.size != (256, 256):
                  raise RuntimeError(f"Unexpected ScumGUI PNG size: {image.size}")

          print(f"Repaired PNG written to {repaired}")

          '@ | Set-Content -Path repair_png.py -Encoding UTF8
          python repair_png.py
          magick "build/scumgui-master.png" -define icon:auto-resize=256,128,64,48,32,24,16 "build/scumgui.ico"
          magick identify "build/scumgui.ico"
          if ($LASTEXITCODE -ne 0) {
            throw "ImageMagick failed to create the Windows icon."
          }

      - name: Download gallery-dl engine
        shell: pwsh
        run: |
          $version = "1.32.13"
          $url = "https://codeberg.org/mikf/gallery-dl/releases/download/v$version/gallery-dl.exe"
          New-Item -ItemType Directory -Force -Path gallery-dl | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "gallery-dl/gallery-dl.exe"
          & "gallery-dl/gallery-dl.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "The bundled gallery-dl executable failed its version check."
          }

      - name: Build executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name ScumGUI
          --icon build/scumgui.ico
          --add-data "assets;assets"
          --paths src
          src/scumgui.py

      - name: Place gallery-dl engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/ScumGUI/Resources" | Out-Null
          Copy-Item "gallery-dl/gallery-dl.exe" "dist/ScumGUI/Resources/gallery-dl.exe"
          Copy-Item "Resources/scumgui-gallery-dl.json" "dist/ScumGUI/Resources/scumgui-gallery-dl.json"
          if (-not (Test-Path "dist/ScumGUI/Resources/scumgui-gallery-dl.json")) {
            throw "The ScumGUI gallery-dl configuration was not included in the build."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ScumGUI-windows-x64
          path: dist/ScumGUI
          if-no-files-found: error
