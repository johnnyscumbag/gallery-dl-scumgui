name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build ScumGUI for Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Download gallery-dl engine
        shell: pwsh
        run: |
          $version = "1.32.13"
          $url = "https://codeberg.org/mikf/gallery-dl/releases/download/v$version/gallery-dl.exe"
          New-Item -ItemType Directory -Force -Path gallery-dl | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "gallery-dl/gallery-dl.exe"
          & "gallery-dl/gallery-dl.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "The bundled gallery-dl executable failed its version check."
          }

      - name: Read ScumGUI version
        shell: pwsh
        run: |
          $match = Select-String -Path "src/scumgui.py" -Pattern '^APP_VERSION\s*=\s*"([^"]+)"\s*$'
          if (-not $match) {
            throw "APP_VERSION was not found in src/scumgui.py."
          }

          $version = $match.Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "APP_VERSION is empty."
          }

          "SCUMGUI_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "ScumGUI version: $version"

      - name: Build executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name ScumGUI
          --icon assets/scumgui.ico
          --add-data "assets;assets"
          --paths src
          src/scumgui.py

      - name: Place gallery-dl engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/ScumGUI/Resources" | Out-Null
          Copy-Item "gallery-dl/gallery-dl.exe" "dist/ScumGUI/Resources/gallery-dl.exe"
          Copy-Item "Resources/scumgui-gallery-dl.json" "dist/ScumGUI/Resources/scumgui-gallery-dl.json"
          Copy-Item "qt.conf" "dist/ScumGUI/qt.conf"

          if (-not (Test-Path "dist/ScumGUI/Resources/scumgui-gallery-dl.json")) {
            throw "The ScumGUI gallery-dl configuration was not included in the build."
          }

          if (-not (Test-Path "dist/ScumGUI/qt.conf")) {
            throw "The ScumGUI Qt style configuration was not included in the build."
          }

      - name: Package build
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $zipName = "ScumGUI-windows-x64-v$env:SCUMGUI_VERSION-$shortSha.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "dist/ScumGUI" -DestinationPath $zipPath -CompressionLevel Optimal

          if (-not (Test-Path $zipPath)) {
            throw "The build ZIP was not created."
          }

          "SCUMGUI_ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          "SCUMGUI_ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

          Write-Host "Created: $zipName"
          Get-Item $zipPath | Select-Object Name, Length

      - name: Upload build to Ultra.cc
        shell: pwsh
        env:
          ULTRA_HOST: ${{ secrets.ULTRA_HOST }}
          ULTRA_USER: ${{ secrets.ULTRA_USER }}
          ULTRA_SSH_KEY: ${{ secrets.ULTRA_SSH_KEY }}
          ULTRA_SFTP_PATH: ${{ secrets.ULTRA_SFTP_PATH }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "scumgui_ultra_key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "scumgui_known_hosts"

          [System.IO.File]::WriteAllText(
            $keyPath,
            $env:ULTRA_SSH_KEY,
            [System.Text.UTF8Encoding]::new($false)
          )

          if (-not (Get-Command ssh -ErrorAction SilentlyContinue)) {
            throw "OpenSSH client (ssh) is not available on the runner."
          }

          if (-not (Get-Command scp -ErrorAction SilentlyContinue)) {
            throw "OpenSSH client (scp) is not available on the runner."
          }

          Write-Host "Resolving $env:ULTRA_HOST..."
          Resolve-DnsName $env:ULTRA_HOST -ErrorAction Stop |
            Where-Object { $_.Type -in @("A", "AAAA") } |
            Select-Object Name, Type, IPAddress |
            Format-Table -AutoSize

          Write-Host "Testing TCP connectivity to $($env:ULTRA_HOST):22..."
          $tcpTest = Test-NetConnection -ComputerName $env:ULTRA_HOST -Port 22 -InformationLevel Detailed
          if (-not $tcpTest.TcpTestSucceeded) {
            throw "TCP connection to $($env:ULTRA_HOST):22 failed."
          }

          Write-Host "Testing SSH authentication and accepting a new host key..."
          ssh -i $keyPath -o "BatchMode=yes" -o "PreferredAuthentications=publickey" -o "StrictHostKeyChecking=accept-new" -o "UserKnownHostsFile=$knownHostsPath" "${env:ULTRA_USER}@${env:ULTRA_HOST}" "true"

          if ($LASTEXITCODE -ne 0) {
            throw "SSH authentication to $env:ULTRA_HOST failed."
          }

          if (-not (Test-Path $knownHostsPath) -or (Get-Item $knownHostsPath).Length -eq 0) {
            throw "SSH did not create a known_hosts entry."
          }

          Write-Host "SSH authentication succeeded."

          $remoteVersionedPath = "$env:ULTRA_SFTP_PATH/$env:SCUMGUI_ZIP_NAME"

          scp -i $keyPath -o "BatchMode=yes" -o "StrictHostKeyChecking=yes" -o "UserKnownHostsFile=$knownHostsPath" $env:SCUMGUI_ZIP_PATH "${env:ULTRA_USER}@${env:ULTRA_HOST}:$remoteVersionedPath"

          if ($LASTEXITCODE -ne 0) {
            throw "SCP upload failed."
          }

          Write-Host "Uploaded $env:SCUMGUI_ZIP_NAME"

          $remoteLatestPath = "$env:ULTRA_SFTP_PATH/ScumGUI-windows-x64-latest.zip"

          ssh -i $keyPath -o "BatchMode=yes" -o "StrictHostKeyChecking=yes" -o "UserKnownHostsFile=$knownHostsPath" "${env:ULTRA_USER}@${env:ULTRA_HOST}" "cp -- '$remoteVersionedPath' '$remoteLatestPath'"

          if ($LASTEXITCODE -ne 0) {
            throw "Remote copy to latest ZIP failed."
          }

          Write-Host "Updated ScumGUI-windows-x64-latest.zip"

          ssh -i $keyPath -o "BatchMode=yes" -o "StrictHostKeyChecking=yes" -o "UserKnownHostsFile=$knownHostsPath" "${env:ULTRA_USER}@${env:ULTRA_HOST}" "ls -lh '$remoteVersionedPath' '$remoteLatestPath'"

          if ($LASTEXITCODE -ne 0) {
            throw "Remote upload verification failed."
          }

      - name: Publish build links
        shell: pwsh
        env:
          ULTRA_HTTP_URL: ${{ secrets.ULTRA_HTTP_URL }}
        run: |
          $baseUrl = $env:ULTRA_HTTP_URL.TrimEnd('/')
          $versionedUrl = "$baseUrl/$env:SCUMGUI_ZIP_NAME"
          $latestUrl = "$baseUrl/ScumGUI-windows-x64-latest.zip"

          @"
          ## ScumGUI Windows build

          **Version:** $env:SCUMGUI_VERSION  
          **Commit:** $env:GITHUB_SHA

          - [Download this build ($env:SCUMGUI_ZIP_NAME)]($versionedUrl)
          - [Download latest build]($latestUrl)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
